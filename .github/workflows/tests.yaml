name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go test ./...
