version: 2

builds:
  - binary: nsq_to_dogstatsd
    main: .
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- if eq .Os "darwin" }}macOS{{ else }}{{ title .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

dockers_v2:
  - images:
      - ruimarinho/nsq-dogstatsd
    tags:
      - latest
      - "{{ .Version }}"
    platforms:
      - linux/amd64
      - linux/arm64
